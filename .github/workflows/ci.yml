# KLAT OS GitHub Actions CI
# Auto-run tests on every push
# Copyright (c) 2026 KLAT OS Team

name: KLAT OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CLANG_VERSION: '18'
  QEMU_VERSION: '8.2'

jobs:
  # ============================================================================
  # Job 1: Build Kernel
  # ============================================================================
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ env.CLANG_VERSION }} \
            lld-${{ env.CLANG_VERSION }} \
            nasm \
            make \
            qemu-system-x86_64 \
            grub-common \
            xorriso \
            xxd

      - name: Setup clang
        run: |
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${{ env.CLANG_VERSION }} 100
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-${{ env.CLANG_VERSION }} 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${{ env.CLANG_VERSION }} 100
          clang --version

      - name: Clean build
        run: make clean || true

      - name: Build kernel
        run: make 2>&1 | tee build.log

      - name: Check for errors
        if: always()
        run: |
          echo "=== Build Log (last 30 lines) ==="
          tail -30 build.log

          if grep -iE "^error:" build.log; then
            echo "ERROR: Build contains errors"
            exit 1
          fi

      - name: Verify kernel binary
        run: |
          if [ -f "build-x86_64/jowokernel.bin" ]; then
            echo "✅ Kernel binary created: $(du -h build-x86_64/jowokernel.bin | cut -f1)"
          else
            echo "❌ ERROR: Kernel binary not found"
            exit 1
          fi

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-binary
          path: build-x86_64/jowokernel.bin
          retention-days: 7

  # ============================================================================
  # Job 2: Regression Tests (QEMU)
  # ============================================================================
  regression-tests:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: build-kernel
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ env.CLANG_VERSION }} \
            lld-${{ env.CLANG_VERSION }} \
            nasm \
            make \
            qemu-system-x86_64 \
            xxd

      - name: Setup clang
        run: |
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${{ env.CLANG_VERSION }} 100
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-${{ env.CLANG_VERSION }} 100

      - name: Build kernel
        run: make 2>&1 | tee build.log

      - name: Run QEMU boot test
        id: qemu-test
        run: |
          echo "=== Starting QEMU Boot Test ==="

          LOG_FILE="qemu_boot.log"

          # Run QEMU with timeout
          timeout 45 qemu-system-x86_64 \
            -nographic \
            -kernel build-x86_64/jowokernel.bin \
            -append "console=ttyS0" \
            -serial file:$LOG_FILE \
            -m 512M \
            -enable-kvm 2>&1 \
            || true

          echo "=== QEMU Output ==="
          if [ -f "$LOG_FILE" ]; then
            cat $LOG_FILE
          fi

      - name: Check for kernel faults
        run: |
          if [ ! -f "qemu_boot.log" ]; then
            echo "❌ No QEMU output captured"
            exit 1
          fi

          # Check for critical errors
          if grep -qiE "(panic|triple fault|#GP|general protection|#PF|page fault)" qemu_boot.log; then
            echo "❌ KERNEL FAULT DETECTED"
            grep -iE "(panic|triple fault|#GP|#PF|page fault)" qemu_boot.log | head -5
            exit 1
          fi

          echo "✅ No kernel faults detected"

      - name: Check for expected output
        run: |
          echo "=== Checking for expected output ==="

          # M3.3 Syscall Tests
          if grep -q "Hello from userspace" qemu_boot.log 2>/dev/null; then
            echo "✅ SYS_WRITE test: PASS"
          else
            echo "⚠️ SYS_WRITE: Output not detected (may still be OK)"
          fi

          if grep -qiE "(exit|EXIT)" qemu_boot.log 2>/dev/null; then
            echo "✅ SYS_EXIT test: PASS"
          else
            echo "⚠️ SYS_EXIT: Not detected (may still be OK)"
          fi

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-logs
          path: |
            qemu_boot.log
            build.log
          retention-days: 7

  # ============================================================================
  # Job 3: Documentation Check
  # ============================================================================
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required documents
        run: |
          echo "=== Documentation Check ==="

          REQUIRED_DOCS=(
            "docs/ABI.md"
            "docs/milestones/M3.3.md"
            "docs/DEFINITION_OF_DONE.md"
            "docs/DEPENDENCIES.md"
            "docs/COMPATIBILITY.md"
            "docs/roadmap/README.md"
            "docs/architecture/README.md"
          )

          MISSING=0
          for doc in "${REQUIRED_DOCS[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "❌ MISSING: $doc"
              MISSING=$((MISSING + 1))
            else
              echo "✅ OK: $doc"
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo ""
            echo "ERROR: $MISSING required documents missing"
            exit 1
          fi

          echo ""
          echo "✅ All required documents present"

  # ============================================================================
  # Job 4: Code Quality
  # ============================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for TODO/FIXME
        run: |
          echo "=== Code Quality Check ==="

          TODO_COUNT=$(grep -r "TODO\|FIXME\|XXX\|HACK\|BUG:" kernel/ --include="*.cpp" --include="*.h" --include="*.S" 2>/dev/null | wc -l)
          echo "Found $TODO_COUNT TODO/FIXME comments in kernel/"

          if [ $TODO_COUNT -gt 100 ]; then
            echo "⚠️ High number of TODOs, consider addressing technical debt"
          fi

      - name: Check file sizes
        run: |
          echo "=== Checking large files ==="
          find kernel -type f \( -name "*.cpp" -o -name "*.h" \) -exec wc -l {} + 2>/dev/null | sort -rn | head -5

  # ============================================================================
  # Job 5: Regression Test Framework
  # ============================================================================
  run-regression:
    name: Run Regression Suite
    runs-on: ubuntu-latest
    needs: build-kernel
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ env.CLANG_VERSION }} \
            qemu-system-x86_64

      - name: Run regression test script
        run: |
          echo "=== Running Regression Suite ==="
          chmod +x tests/regression/run_all.sh

          # Run the regression tests
          ./tests/regression/run_all.sh 2>&1 | tee regression.log

          # Check exit code
          EXIT_CODE=${PIPESTATUS[0]}

          if [ $EXIT_CODE -eq 0 ]; then
            echo ""
            echo "✅ ALL REGRESSION TESTS PASSED"
          else
            echo ""
            echo "⚠️ Some regression tests may have failed"
          fi

      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-suite-logs
          path: |
            regression.log
            test_output_*.log
          retention-days: 7

  # ============================================================================
  # Summary
  # ============================================================================
  summary:
    name: Build Summary
    needs: [build-kernel, regression-tests, documentation, code-quality, run-regression]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Print Summary
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║              KLAT OS CI BUILD SUMMARY                          ║"
          echo "╠═══════════════════════════════════════════════════════════════╣"
          echo "║"
          echo "║  🏗️  Build Kernel:    ${{ needs.build-kernel.result }}"
          echo "║  🧪 Regression:      ${{ needs.regression-tests.result }}"
          echo "║  📚 Documentation:     ${{ needs.documentation.result }}"
          echo "║  🔍 Code Quality:     ${{ needs.code-quality.result }}"
          echo "║  🔄 Regression Suite: ${{ needs.run-regression.result }}"
          echo "║"
          echo "╚═══════════════════════════════════════════════════════════════╝"
          echo ""

          if [[ "${{ needs.build-kernel.result }}" == "success" ]] && \
             [[ "${{ needs.documentation.result }}" == "success" ]]; then
            echo "✅ Core build and documentation: PASS"
          else
            echo "❌ Core build or documentation: FAIL"
          fi

      - name: Update PR Status
        if: always()
        run: |
          echo "PR Status Updated"
